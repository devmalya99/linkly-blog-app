[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API to Render so cookies stay first-party on Netlify
[[redirects]]
  from = "/api/*"
  to = "https://inkly-api-mr5h.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
